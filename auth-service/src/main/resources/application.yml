spring:
  application:
    name: crm-auth-service

  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # O schema de identidade pertence ao crm-backend (Flyway); o auth-service
  # apenas lê o banco CRM compartilhado.
  flyway:
    enabled: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # JWKS sempre do Keycloak — o auth-service não possui JWKS próprio.
          issuer-uri: ${AUTH_KEYCLOAK_ISSUER_URI:}
          jwk-set-uri: ${AUTH_KEYCLOAK_JWKS_URI:}

  # Redis — usado pelo RedisGatewaySessionStore (auth.gateway.session-store=redis).
  # A conexão é lazy (Lettuce); o store em memória não a utiliza. Atenção: o
  # Spring Boot ignora host/port/password/database quando spring.data.redis.url
  # está preenchido — por isso usamos host/port/password (o password não vai na
  # URL, evitando expô-lo em métricas/logs).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 16

# Access Gateway OIDC (Sprint 6.1). O auth-service é o OAuth2 Client: inicia o
# Authorization Code + PKCE S256 no Keycloak, troca o code no servidor e cria a
# sessão de browser (cookie HttpOnly). redirect-uri fixa (paridade Keycloak) e
# allowlist de redirect pós-login via AUTH_GATEWAY_ALLOWED_REDIRECT_URIS.
auth:
  gateway:
    enabled: ${AUTH_GATEWAY_ENABLED:true}
    issuer-uri: ${AUTH_GATEWAY_ISSUER_URI:${AUTH_KEYCLOAK_ISSUER_URI:}}
    authorization-endpoint: ${AUTH_GATEWAY_AUTHORIZATION_ENDPOINT:${AUTH_KEYCLOAK_ISSUER_URI:}/protocol/openid-connect/auth}
    token-endpoint: ${AUTH_GATEWAY_TOKEN_ENDPOINT:${AUTH_KEYCLOAK_ISSUER_URI:}/protocol/openid-connect/token}
    jwks-uri: ${AUTH_GATEWAY_JWKS_URI:${AUTH_KEYCLOAK_JWKS_URI:}}
    client-id: ${AUTH_GATEWAY_CLIENT_ID:crm-gateway}
    client-secret: ${AUTH_GATEWAY_CLIENT_SECRET:}
    redirect-uri: ${AUTH_GATEWAY_REDIRECT_URI:http://localhost:8082/auth/callback}
    allowed-redirect-uris: ${AUTH_GATEWAY_ALLOWED_REDIRECT_URIS:http://localhost:3000,https://srv1348261.hstgr.cloud}
    cookie-name: ${AUTH_GATEWAY_COOKIE_NAME:crm_session}
    secure-cookie: ${AUTH_GATEWAY_SECURE_COOKIE:true}
    session-ttl: ${AUTH_GATEWAY_SESSION_TTL:8h}
    session-idle-timeout: ${AUTH_GATEWAY_SESSION_IDLE_TIMEOUT:0s}
    csrf-cookie-name: ${AUTH_GATEWAY_CSRF_COOKIE_NAME:XSRF-TOKEN}
    csrf-header-name: ${AUTH_GATEWAY_CSRF_HEADER_NAME:X-XSRF-TOKEN}
    # Storage das sessões de browser do gateway (Sprint 6.3): 'memory' (padrão,
    # nó único) ou 'redis' (distribuído, compartilhado entre réplicas).
    session-store: ${AUTH_GATEWAY_SESSION_STORE:memory}
    session-lock-ttl: ${AUTH_GATEWAY_SESSION_LOCK_TTL:30s}
    session-lock-acquire-timeout: ${AUTH_GATEWAY_SESSION_LOCK_ACQUIRE_TIMEOUT:5s}
    # BFF relay (Sprint 6.4): base do crm-backend para repassar /api/** com o
    # access token da sessão. No Docker deve apontar para o serviço do backend
    # na rede interna (ex.: http://crm-backend:8081).
    api-backend-url: ${AUTH_GATEWAY_API_BACKEND_URL:http://localhost:8081}
    api-connect-timeout: ${AUTH_GATEWAY_API_CONNECT_TIMEOUT:5s}
    api-read-timeout: ${AUTH_GATEWAY_API_READ_TIMEOUT:30s}
    # Rate limiting distribuído (Sprint 6.6): janela fixa em Redis sobre os
    # endpoints sensíveis de autenticação. Política Redis down = fail-controlled
    # (permite a requisição com warning; nunca bloqueia o fluxo legítimo).
    rate-limit-enabled: ${AUTH_GATEWAY_RATE_LIMIT_ENABLED:true}
    rate-limit-window: ${AUTH_GATEWAY_RATE_LIMIT_WINDOW:60s}
    rate-limit-authorize: ${AUTH_GATEWAY_RATE_LIMIT_AUTHORIZE:20}
    rate-limit-callback: ${AUTH_GATEWAY_RATE_LIMIT_CALLBACK:20}
    rate-limit-refresh: ${AUTH_GATEWAY_RATE_LIMIT_REFRESH:30}
    rate-limit-logout: ${AUTH_GATEWAY_RATE_LIMIT_LOGOUT:20}
    rate-limit-api: ${AUTH_GATEWAY_RATE_LIMIT_API:60}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true

logging:
  level:
    com.becommerce.auth: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %X{correlationId:-} [%thread] %-5level %logger{36} - %msg%n"
