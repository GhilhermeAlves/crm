name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: backend
        run: ./mvnw clean verify

      - name: Checkstyle
        working-directory: backend
        run: ./mvnw checkstyle:check

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/

  auth-service:
    name: Auth-service CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: auth-service
        run: ./mvnw clean verify

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend]

    # 4.1 — Setup de tooling. O Playwright gerencia SOMENTE o frontend
    # (webServer do playwright.config.ts) e o smoke atual usa apenas rotas
    # públicas, portanto não precisa da stack de apoio.
    #
    # 4.2+ (login/logout e specs de negócio) — este job passa a subir a stack
    # completa antes do `npm run test:e2e`, reutilizando as MESMAS
    # imagens/versões dos compose do repo (docker-compose.yml na raiz para
    # postgres:17-alpine/redis:7-alpine/rabbitmq:4-management-alpine/keycloak:26.3
    # e docker/docker-compose.yml para backend/auth-service/frontend):
    #   * keycloak com realm "CRM" + client `crm-gateway` importados e usuário
    #     E2E seedado (fixtures/users.json) — ver Task 4.2.
    #   * backend com SPRING_PROFILES_ACTIVE=prod,
    #     CORS_ALLOWED_ORIGINS=http://localhost:3000 e
    #     SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_* apontando para o Keycloak.
    #   * auth-service com AUTH_GATEWAY_* apontando para o Keycloak e
    #     AUTH_GATEWAY_API_BACKEND_URL=http://backend:8080.
    #   * frontend buildado pelo webServer com DEV_GATEWAY_TARGET=http://localhost:8082
    #     (rewrites de /auth/** e /api/** para o gateway, substituindo o nginx).

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend, auth-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: crm-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build auth-service image
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: false
          tags: crm-auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: crm-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max