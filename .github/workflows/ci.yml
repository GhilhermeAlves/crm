name: CI Pipeline

on:
  # Branches do fluxo em DEPLOYMENT_WORKFLOW.md: feature/* -> crm-improvements-deploy-phase.
  # O deploy segue manual; este workflow só testa.
  push:
    branches: [crm-improvements-deploy-phase, 'feature/**']
  pull_request:
    branches: [crm-improvements-deploy-phase]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: backend
        run: ./mvnw clean verify

      - name: Checkstyle
        working-directory: backend
        run: ./mvnw checkstyle:check

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/

  auth-service:
    name: Auth-service CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: auth-service
        run: ./mvnw clean verify

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-refine/package-lock.json

      - name: Install dependencies
        working-directory: frontend-refine
        run: npm ci

      - name: Lint
        working-directory: frontend-refine
        run: npm run lint

      - name: Type check
        working-directory: frontend-refine
        run: npm run typecheck

      - name: Format check
        working-directory: frontend-refine
        run: npm run format:check

      - name: Build
        working-directory: frontend-refine
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    # 4.2 — Os testes de login/logout (auth.spec.ts) rodam contra a stack
    # completa, subida por `e2e/compose.ci.yml` (postgres:17-alpine,
    # redis:7-alpine, rabbitmq:4-management-alpine, keycloak:26.3 + backend e
    # auth-service buildados dos Dockerfiles do repo). O Playwright gerencia
    # SOMENTE o frontend (webServer do playwright.config.ts).
    #
    # Fluxo:
    #   * /etc/hosts: `127.0.0.1 keycloak` para o browser resolver o hostname
    #     único do Keycloak (containeres resolvem via DNS da rede Docker).
    #   * realm dev "CRM" + client `crm-gateway` importados no boot do
    #     Keycloak (--import-realm → infrastructure/keycloak/import);
    #     usuário E2E seedado na API do CRM após o backend ficar saudável
    #     (e2e/seed/user.sql) — o auto-provisioning criaria crm_enabled=false.
    #   * auth-service com AUTH_GATEWAY_* apontando para o Keycloak,
    #     redirect fixo http://localhost:8082/auth/callback e
    #     AUTH_GATEWAY_API_BACKEND_URL=http://backend:8080.
    #   * frontend buildado pelo webServer com DEV_GATEWAY_TARGET=http://localhost:8082
    #     (rewrites de /auth/** e /api/** para o gateway, substituindo o nginx).

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-refine/package-lock.json

      - name: Install dependencies
        working-directory: frontend-refine
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend-refine
        run: npx playwright install --with-deps chromium

      - name: Map keycloak hostname to localhost
        run: sudo tee -a /etc/hosts > /dev/null <<< "127.0.0.1 keycloak"

      - name: Build E2E stack images
        run: docker compose -f e2e/compose.ci.yml build
        env:
          DOCKER_BUILDKIT: "1"

      - name: Start E2E stack
        run: docker compose -f e2e/compose.ci.yml up -d --wait
        timeout-minutes: 15

      - name: Seed E2E user (após Flyway/seeders do backend)
        run: |
          docker compose -f e2e/compose.ci.yml exec -T \
            -e PGPASSWORD=crm_admin \
            postgres \
            psql -U crm_admin -d crm_main -v ON_ERROR_STOP=1 < e2e/seed/user.sql
          docker compose -f e2e/compose.ci.yml exec -T \
            -e PGPASSWORD=crm_admin \
            postgres \
            psql -U crm_admin -d crm_main -v ON_ERROR_STOP=1 < e2e/seed/inbox.sql

      - name: Run E2E tests
        working-directory: frontend-refine
        env:
          CI: 'true'
          DEV_GATEWAY_TARGET: http://localhost:8082
        run: npm run test:e2e -- --shard=1/1 --forbid-only

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend-refine/playwright-report/
          retention-days: 7

      - name: Dump E2E stack logs on failure
        if: failure()
        run: docker compose -f e2e/compose.ci.yml logs --no-color --tail=300 backend auth-service keycloak

      - name: Tear down E2E stack
        if: always()
        run: docker compose -f e2e/compose.ci.yml down -v --remove-orphans

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend, auth-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: crm-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build auth-service image
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: false
          tags: crm-auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-refine
          push: false
          tags: crm-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max