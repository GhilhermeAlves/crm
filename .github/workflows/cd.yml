name: CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.img.outputs.name }}/backend:latest
            ${{ steps.img.outputs.name }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: |
            ${{ steps.img.outputs.name }}/auth-service:latest
            ${{ steps.img.outputs.name }}/auth-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.img.outputs.name }}/frontend:latest
            ${{ steps.img.outputs.name }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to staging server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY_B64: ${{ secrets.DEPLOY_KEY_B64 }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SCRIPT: |
            set -e
            cd /opt/crm/docker
            curl -fsSL -o docker-compose.yml.new \
              "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker/docker-compose.yml"
            mv docker-compose.yml.new docker-compose.yml
            docker compose pull
            docker compose up -d
            echo "Deploy concluido (staging)"
        run: |
          echo "$DEPLOY_KEY_B64" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s" <<EOS
          $DEPLOY_SCRIPT
          EOS

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Deploy to production server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY_B64: ${{ secrets.DEPLOY_KEY_B64 }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SCRIPT: |
            set -e
            cd /opt/crm/docker
            curl -fsSL -o docker-compose.yml.new \
              "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker/docker-compose.yml"
            mv docker-compose.yml.new docker-compose.yml
            docker compose pull
            docker compose up -d
            echo "Deploy concluido (production)"
        run: |
          echo "$DEPLOY_KEY_B64" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s" <<EOS
          $DEPLOY_SCRIPT
          EOS

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
