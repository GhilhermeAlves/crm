spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/crm_test
    username: ${CRM_DATABASE_USERNAME:postgres}
    password: ${CRM_DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
