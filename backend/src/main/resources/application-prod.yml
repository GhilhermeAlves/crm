spring:
  datasource:
    url: jdbc:postgresql://${CRM_DATABASE_HOST:localhost}:${CRM_DATABASE_PORT:5432}/${CRM_DATABASE_NAME:crm}
    username: ${CRM_DATABASE_USERNAME}
    password: ${CRM_DATABASE_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

# Sprint 6.10 — documentação da API desabilitada em produção (/docs → 404).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Sprint 6.10 — exposição do actuator restrita a health em produção.
management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.becommerce.crm: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# CORS: em produção a allowlist é obrigatória. O frontend é servido no mesmo
# domínio (o nginx roteia /api e /auth) e não depende de CORS, mas a ausência de
# origens falha na inicialização (CorsConfig) para evitar política indefinida.
# Defina CORS_ALLOWED_ORIGINS (ou APP_CORS_ALLOWED_ORIGINS) na VPS.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
