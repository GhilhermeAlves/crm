spring:
  application:
    name: crm-backend

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/crm
    username: ${CRM_DATABASE_USERNAME:postgres}
    password: ${CRM_DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: ${TENANT_ID:public}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${CRM_REDIS_HOST:localhost}
      port: ${CRM_REDIS_PORT:6379}
      password: ${CRM_REDIS_PASSWORD:}
      timeout: 60000

  rabbitmq:
    host: ${CRM_RABBITMQ_HOST:localhost}
    port: ${CRM_RABBITMQ_PORT:5672}
    username: ${CRM_RABBITMQ_USERNAME:guest}
    password: ${CRM_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Retry local (3 tentativas com backoff) antes de rejeitar para a DLQ.
        retry:
          enabled: true
          initial-interval: 1000ms
          multiplier: 2
          max-attempts: 3
          max-interval: 10000ms
        # Após retry esgotado: rejeita e roteia para a DLQ (crm.whatsapp.<queue>.dlq).
        default-requeue-rejected: false
        # Em cold start (Broker da VPS ainda não deu o bind), o RabbitAdmin declara
        # a topologia antes dos listeners ativarem — evita falha fatal de fila ausente.
        missing-queues-fatal: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:}

  mvc:
    formcontent:
      filter:
        enabled: false

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

server:
  port: 8080
  servlet:
    context-path: /api/v1

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  tenant:
    header: ${TENANT_HEADER:X-Tenant-ID}
    resolver: ${TENANT_RESOLVER:jwt}
  auth:
    provisioning:
      enabled: ${AUTH_PROVISIONING_ENABLED:true}
      default-company-id: ${AUTH_DEFAULT_COMPANY_ID:}
      default-role: ${AUTH_DEFAULT_ROLE:AGENT}
    identity-layer:
      enabled: ${AUTH_IDENTITY_LAYER_ENABLED:false}
      auth-service-url: ${AUTH_SERVICE_URL:}
      internal-api-token: ${AUTH_INTERNAL_API_TOKEN:}
  mail:
    provider: ${MAIL_PROVIDER:console}
    from: ${MAIL_FROM:}
    frontend-base-url: ${MAIL_FRONTEND_BASE_URL:http://localhost:3000}
    log-token: ${MAIL_LOG_TOKEN:false}
  invitations:
    base-url: ${INVITATION_BASE_URL:}
  ai:
    provider: ${AI_PROVIDER:openai}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    timeout: ${AI_TIMEOUT:30s}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
omnichannel:
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:fake}
    app-secret: ${CRM_WHATSAPP_APP_SECRET:}
    webhook-verify-token: ${CRM_WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
    webhook-allow-unsigned: ${WHATSAPP_WEBHOOK_ALLOW_UNSIGNED:false}
    uazapi:
      base-url: ${UAZAPI_BASE_URL:}         # base URL da instância UAZAPI (ex.: https://<subdomain>.uazapi.com)
      token: ${UAZAPI_TOKEN:}               # token da instância (fallback global; por canal via UAZAPI_TOKEN_<ref>)

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /docs/swagger

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true
    redis:
      enabled: true
    rabbit:
      enabled: true

logging:
  level:
    com.becommerce.crm: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
