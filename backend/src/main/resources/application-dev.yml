spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/crm_dev

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

logging:
  level:
    com.becommerce.crm: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
