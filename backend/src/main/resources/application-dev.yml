spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/crm_dev

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://76.13.237.238:8080/realms/CRM
          jwk-set-uri: http://76.13.237.238:8080/realms/CRM/protocol/openid-connect/certs

logging:
  level:
    com.becommerce.crm: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

app:
  cors:
    allowed-origins: http://localhost:3000,http://76.13.237.238:3000
  security:
    reset-token:
      expiration-hours: 1
