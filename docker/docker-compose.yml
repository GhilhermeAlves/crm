version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: crm-backend
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - CRM_DATABASE_HOST=postgres
      - CRM_DATABASE_PORT=5432
      - CRM_DATABASE_NAME=crm
      - CRM_DATABASE_USERNAME=postgres
      - CRM_DATABASE_PASSWORD=postgres
      - CRM_REDIS_HOST=redis
      - CRM_REDIS_PORT=6379
      - CRM_RABBITMQ_HOST=rabbitmq
      - CRM_RABBITMQ_PORT=5672
      - CRM_RABBITMQ_USERNAME=${CRM_RABBITMQ_USERNAME}
      - CRM_RABBITMQ_PASSWORD=${CRM_RABBITMQ_PASSWORD}
      - TENANT_ID=public
      - APP_CORS_ALLOWED_ORIGINS=https://srv1348261.hstgr.cloud,http://localhost:3000
      - KEYCLOAK_ISSUER_URI=https://srv1348261.hstgr.cloud/realms/CRM
      - KEYCLOAK_JWKS_URI=https://srv1348261.hstgr.cloud/realms/CRM/protocol/openid-connect/certs
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - CRM_REDIS_PASSWORD=${CRM_REDIS_PASSWORD}
      - CRM_REDIS_HOST=redis
      - CRM_REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - crm-network
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: crm-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
    depends_on:
      - backend
    networks:
      - crm-network
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: crm-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=crm
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: crm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: crm-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: crm-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - crm-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:

networks:
  crm-network:
    driver: bridge
