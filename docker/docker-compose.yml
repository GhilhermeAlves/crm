version: '3.8'

# =============================================================================
# CRM — Aplicação (backend, auth-service/gateway, frontend)
# =============================================================================
# Sprint 6.10 — Hardening de produção:
#   - Removeu os serviços datastore vestigiais (postgres/redis/rabbitmq/minio)
#     com credenciais default hardcoded (postgres/postgres, guest/guest,
#     minioadmin/minioadmin). Os datastores reais vivem no compose de
#     infraestrutura (docker-compose.yml na raiz, projeto crm-infrastructure)
#     com credenciais provenientes do .env.
#   - Publicações de porta restritas ao loopback (127.0.0.1:) — todo o acesso
#     externo legítimo passa pelo nginx (443).
#   - SPRING_PROFILES_ACTIVE=prod (docs/actuator restritos em produção).
#   - Credenciais de banco/mensageria 100% derivadas do .env (sem defaults
#     inseguros no arquivo).
# =============================================================================

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: crm-backend
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_SERVLET_CONTEXT_PATH=
      - CRM_DATABASE_HOST=postgres
      - CRM_DATABASE_PORT=5432
      - CRM_DATABASE_NAME=crm
      - CRM_DATABASE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - CRM_DATABASE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - CRM_REDIS_HOST=redis
      - CRM_REDIS_PORT=6379
      - CRM_REDIS_PASSWORD=${CRM_REDIS_PASSWORD}
      - CRM_RABBITMQ_HOST=rabbitmq
      - CRM_RABBITMQ_PORT=5672
      - CRM_RABBITMQ_USERNAME=${CRM_RABBITMQ_USERNAME}
      - CRM_RABBITMQ_PASSWORD=${CRM_RABBITMQ_PASSWORD}
      - TENANT_ID=public
      - AUTH_IDENTITY_LAYER_ENABLED=${AUTH_IDENTITY_LAYER_ENABLED:-false}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:8080}
      - AUTH_DEFAULT_COMPANY_ID=${AUTH_DEFAULT_COMPANY_ID:-}
      - APP_CORS_ALLOWED_ORIGINS=https://srv1348261.hstgr.cloud,http://localhost:3000
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=https://srv1348261.hstgr.cloud/realms/CRM
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKS_URI=http://crm-keycloak:8080/realms/CRM/protocol/openid-connect/certs
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://crm-keycloak:8080/realms/CRM/protocol/openid-connect/certs
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_FLYWAY_URL=${SPRING_DATASOURCE_URL}
      - SPRING_FLYWAY_USER=crm_admin
      - SPRING_FLYWAY_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - crm-network
    restart: unless-stopped

  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    container_name: crm-auth-service
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - AUTH_KEYCLOAK_ISSUER_URI=https://srv1348261.hstgr.cloud/realms/CRM
      - AUTH_KEYCLOAK_JWKS_URI=http://crm-keycloak:8080/realms/CRM/protocol/openid-connect/certs
      - AUTH_GATEWAY_ENABLED=true
      - AUTH_GATEWAY_ENABLED_PROVIDERS=google
      - AUTH_GATEWAY_PHONE_ENABLED=true
      - AUTH_GATEWAY_CLIENT_ID=crm-gateway
      - AUTH_GATEWAY_CLIENT_SECRET=${AUTH_GATEWAY_CLIENT_SECRET}
      - AUTH_GATEWAY_REDIRECT_URI=https://srv1348261.hstgr.cloud/auth/callback
      - AUTH_GATEWAY_ALLOWED_REDIRECT_URIS=https://srv1348261.hstgr.cloud/login,https://srv1348261.hstgr.cloud/dashboard,https://srv1348261.hstgr.cloud
      - AUTH_GATEWAY_APP_BASE_URL=https://srv1348261.hstgr.cloud
      - AUTH_GATEWAY_API_BACKEND_URL=http://backend:8080
      - AUTH_GATEWAY_ISSUER_URI=https://srv1348261.hstgr.cloud/realms/CRM
      - AUTH_GATEWAY_SESSION_STORE=redis
      - AUTH_GATEWAY_SESSION_TTL=8h
      - AUTH_GATEWAY_SESSION_IDLE_TIMEOUT=0s
      - AUTH_GATEWAY_AUTHORIZATION_REQUEST_TTL=30m
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    extra_hosts:
      - "srv1348261.hstgr.cloud:76.13.237.238"
    networks:
      - crm-network
    restart: unless-stopped
    # Liveness (Sprint 6.6): /auth/health não depende de Redis/Keycloak — o
    # container só marca unhealthy se o processo parar. O readiness de
    # dependências é exposto em /auth/health/ready para monitoramento.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/auth/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: crm-frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - crm-network
    restart: unless-stopped

networks:
  crm-network:
    external: true
    name: crm-network
