# =============================================================================
# CRM — Nginx reverse proxy (produção) — VPS srv1348261.hstgr.cloud
# =============================================================================
# Cópia gerenciada (fonte da verdade) do /etc/nginx/sites-available/crm.
# Sprint 6.10 — hardening:
#   - Removida a exposição /docs/ (springdoc desabilitado no profile prod).
#   - /actuator/ restrito a /actuator/health (exato); demais endpoints → 404.
#   - server_tokens off.
# Sprint 7.4 — recuperação de conta: forgot/reset-password públicos direto no
# backend (sem sessão do gateway), como o fluxo phone/OTP (Sprint 7.3).
# Todo tráfego externo entra por aqui (443); os containers escutam só no
# loopback (127.0.0.1:).
# =============================================================================

server {
    listen 80;
    server_name srv1348261.hstgr.cloud 76.13.237.238;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name srv1348261.hstgr.cloud 76.13.237.238;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/srv1348261.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv1348261.hstgr.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Phone Auth (Sprint 7.3) — rotas públicas diretas no backend
    location /api/v1/auth/phone/ {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # Sprint 7.4 — recuperação de senha: forgot-password é público (sem sessão
    # do gateway). Roteado direto ao crm-backend (8081); o backend gera o token
    # de reset e o entrega via EmailService (nunca no log).
    location /api/v1/auth/forgot-password {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sprint 7.4 — reset-password é público (POST com o token de reset; sem
    # sessão). O backend valida o token e delega o reset REAL da credencial ao
    # auth-service (Keycloak Admin) via rede interna.
    location /api/v1/auth/reset-password {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend CRM (via gateway/relay do auth-service)
    location /api/ {
        proxy_pass http://localhost:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator — somente health (Sprint 6.10); demais endpoints → 404.
    location = /actuator/health {
        proxy_pass http://localhost:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /actuator/ {
        return 404;
    }

    # Access Gateway OIDC (auth-service): authorize, callback, logout, refresh, health
    location /auth/ {
        proxy_pass http://localhost:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keycloak (realm CRM)
    location /realms/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /resources/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /js/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}