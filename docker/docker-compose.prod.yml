version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: crm-backend-prod
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - CRM_DATABASE_HOST=postgres
      - CRM_DATABASE_PORT=5432
      - CRM_DATABASE_NAME=crm
      - CRM_DATABASE_USERNAME=${CRM_DATABASE_USERNAME}
      - CRM_DATABASE_PASSWORD=${CRM_DATABASE_PASSWORD}
      - CRM_REDIS_HOST=redis
      - CRM_REDIS_PORT=6379
      - CRM_REDIS_PASSWORD=${CRM_REDIS_PASSWORD}
      - CRM_RABBITMQ_HOST=rabbitmq
      - CRM_RABBITMQ_PORT=5672
      - CRM_RABBITMQ_USERNAME=${CRM_RABBITMQ_USERNAME}
      - CRM_RABBITMQ_PASSWORD=${CRM_RABBITMQ_PASSWORD}
      - AUTH_IDENTITY_LAYER_ENABLED=${AUTH_IDENTITY_LAYER_ENABLED:-false}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - crm-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: crm-frontend-prod
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
    depends_on:
      - backend
    networks:
      - crm-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  postgres:
    image: postgres:16
    container_name: crm-postgres-prod
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=crm
      - POSTGRES_USER=${CRM_DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${CRM_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CRM_DATABASE_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  redis:
    image: redis:7
    container_name: crm-redis-prod
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${CRM_REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${CRM_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  rabbitmq:
    image: rabbitmq:3-management
    container_name: crm-rabbitmq-prod
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${CRM_RABBITMQ_USERNAME}
      - RABBITMQ_DEFAULT_PASS=${CRM_RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  minio:
    image: minio/minio
    container_name: crm-minio-prod
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - crm-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:

networks:
  crm-network:
    external: true
